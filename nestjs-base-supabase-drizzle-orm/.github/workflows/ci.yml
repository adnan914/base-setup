name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nestjs_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nestjs_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      API_PREFIX: api/v1
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ci-secret-that-is-long-enough-for-validation
      JWT_ACCESS_TOKEN_EXPIRES_IN: 15m
      JWT_REFRESH_TOKEN_EXPIRES_IN: 7d
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nestjs_app_test
      DATABASE_SSL: false
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      SWAGGER_ENABLED: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run db:migrate:test
      - run: npm run test:e2e -- --runInBand
