<form [formGroup]="form" (ngSubmit)="submit()">
    <input formControlName="token" type="text" placeholder="Reset Token" />
    <input formControlName="password" type="password" placeholder="New Password" />
    <input formControlName="confirmPassword" type="password" placeholder="Confirm New Password" />
    <button type="submit" >Reset Password</button>
  </form>
