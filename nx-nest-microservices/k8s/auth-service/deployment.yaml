apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ecommerce/auth-service:latest
          ports:
            - containerPort: 50051
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: ecommerce-secrets
            - configMapRef:
                name: ecommerce-config
          env:
            - name: AUTH_GRPC_BIND_URL
              value: 0.0.0.0:50051
            - name: AUTH_HTTP_PORT
              value: "3001"
            - name: USER_GRPC_URL
              value: user-service:50052
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
