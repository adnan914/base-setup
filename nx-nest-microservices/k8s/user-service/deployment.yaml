apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ecommerce/user-service:latest
          ports:
            - containerPort: 50052
            - containerPort: 3002
          envFrom:
            - secretRef:
                name: ecommerce-secrets
            - configMapRef:
                name: ecommerce-config
          env:
            - name: USER_GRPC_BIND_URL
              value: 0.0.0.0:50052
            - name: USER_HTTP_PORT
              value: "3002"
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
