services:
  # ---------------------------------------
  # 1. DATABASE
  # ---------------------------------------
  db:
    image: postgres:15
    container_name: focused_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - focused_network

  # ---------------------------------------
  # 2. MIGRATIONS (RUNS ONCE BEFORE SERVICES)
  # ---------------------------------------
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focused_migrations
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_HOST: db        # ⬅ IMPORTANT OVERRIDE
      DATABASE_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "yarn db:setup:prod"]
    restart: "no"
    networks:
      - focused_network

  # ---------------------------------------
  # 3. APP SERVICES (SINGLE CONTAINER)
  # ---------------------------------------
  app-services:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focused_app_services
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      GATEWAY_PORT: ${GATEWAY_PORT}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      AUTH_SERVICE_URL: http://127.0.0.1:${AUTH_SERVICE_PORT}
      USER_SERVICE_URL: http://127.0.0.1:${USER_SERVICE_PORT}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    command: ["sh", "./scripts/start-services.sh"]
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9010:${GATEWAY_PORT}"
    networks:
      - focused_network

# ---------------------------------------
# VOLUMES + NETWORKS
# ---------------------------------------
volumes:
  db_data:

networks:
  focused_network:
    driver: bridge
